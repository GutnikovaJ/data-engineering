version: 2
models:
- name: stg_shop__customers
  description: 'Клиенты: одна строка на клиента.'
  columns:
  - name: customer_id
    description: Номер клиента.
    data_tests:
    - unique
    - not_null
  - name: registered_at
    description: Время регистрации.
  - name: registration_date
    description: Дата регистрации.
  - name: city
    description: Город клиента.
  - name: acquisition_channel
    description: Канал привлечения.
- name: stg_shop__products
  description: 'Товары: одна строка на товар.'
  columns:
  - name: product_id
    description: Номер товара.
    data_tests:
    - unique
    - not_null
  - name: category_name
    description: Название категории товара.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_shop__product_categories')
          field: category_name
  - name: brand
    description: Бренд товара.
  - name: product_name
    description: Название товара.
- name: stg_shop__product_categories
  description: 'Категории: одна строка на узел дерева.'
  columns:
  - name: category_id
    description: Номер категории.
    data_tests:
    - unique
    - not_null
  - name: parent_category_id
    description: Номер родительской категории; NULL у корня.
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_shop__product_categories')
          field: category_id
  - name: category_name
    description: Название категории товара.
    data_tests:
    - unique
    - not_null
- name: stg_shop__orders
  description: 'Заказы, включая тестовые: одна строка на заказ.'
  columns:
  - name: order_id
    description: Номер заказа.
    data_tests:
    - unique
    - not_null
  - name: customer_id
    description: Номер клиента.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_shop__customers')
          field: customer_id
  - name: ordered_at
    description: Время оформления заказа.
  - name: order_date
    description: Дата оформления заказа.
  - name: order_status
    description: Статус заказа.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - paid
          - pending
          - returned
          - cancelled
          - test
  - name: order_amount
    description: Стоимость заказа после скидок, руб.
    data_tests:
    - not_null
    - non_negative
  - name: is_test_order
    description: Признак тестового заказа.
    data_tests:
    - not_null
- name: stg_shop__order_items
  description: 'Позиции: одна строка на пару заказа и товара.'
  columns:
  - name: order_item_id
    description: 'Ключ позиции: order_id-product_id.'
    data_tests:
    - unique
    - not_null
  - name: order_id
    description: Номер заказа.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_shop__orders')
          field: order_id
  - name: product_id
    description: Номер товара.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_shop__products')
          field: product_id
  - name: quantity
    description: Количество единиц товара.
    data_tests:
    - not_null
    - non_negative
  - name: unit_price
    description: Цена единицы товара, руб.
    data_tests:
    - not_null
    - non_negative
  - name: discount_amount
    description: Скидка на всю позицию, руб.
    data_tests:
    - not_null
    - non_negative
  - name: line_amount
    description: Стоимость позиции после скидки, руб.
    data_tests:
    - not_null
    - non_negative
  - name: gross_amount
    description: Стоимость позиции до скидки, руб.
- name: stg_shop__payments
  description: 'Платежи: одна строка на операцию.'
  columns:
  - name: payment_id
    description: Номер операции.
    data_tests:
    - unique
    - not_null
  - name: order_id
    description: Номер заказа.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_shop__orders')
          field: order_id
  - name: paid_at
    description: Время операции; NULL для ожидающей оплаты.
  - name: payment_status
    description: Статус операции.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - success
          - failed
          - pending
  - name: amount
    description: Сумма операции, руб.; отрицательная при возврате.
    data_tests:
    - not_null
  - name: is_refund
    description: Успешная операция с отрицательной суммой.
    data_tests:
    - not_null
